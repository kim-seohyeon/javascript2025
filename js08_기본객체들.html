<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.배열 사용하기
        // - 배열을 선언하는 방법
        var arrayObj = new Array("v1","v2","v3"); //생성자로 객체 생성하는 방법
        var arrayLit = ["v1","v2","v3"]; //리터럴 방식
        
        //java에서는
        //int []a = new int[3]; //[0,0,0] 자릿수만 정의하면 자동 초기화
        //JS에서는 자동 초기화 지원 X
        //new Array(3); //[ , , ]

        //타입이 서로 다른 값을 저장할 수도 있다.
        var arrayObj02 = ["v1", 7, true];

        //배열선언 단계별 확인인
        var array03 = new Array(); //배열 선언
        var array04 = new Array(10); //배열 선언, 자릿수 정의
        var array05 = new Array(2, 3, 4, 5, 6); //선언, 정의, 초기화 진행
        var array06 = []; //리터럴 선언
        array04[0] = "배열1"; //값 저장

        //반목문 사용하기
        //for문 vs forEach() : 실행속도 for문 좋음(규모가 있는 배열에서)
        //JS 진영해서는 forEach()를 더 권장하고 있음.
        //반복문: for문
        for(var i=0; i<10; i++){

        }
        //배열 객체에서 제공하는 반복문 기능 메서드: forEach(), map(), filter(), reduce()
        //메서드는 앞에 객체가 있어야 함. 배열의 길이만큼 반복. item, index, arr은 파라미터
        array05.forEach(function(item, index, arr){//(가져오는 값, 순차적 증가, 자신의 객체)
            console.log(item, index);
        }); 
        //map, filter, reduce 정리하기
        //배열에서 제공하는 여러 메서드들 정리하기
        // - sort(), push(), shift(), pop(), slice(), splice(),
        // - indexOf()/lastIndexOf(), concat()

        //3. Math 객체
        // - 수학적 계산을 위한 객체로 여러 함수와 상수들을 제공한다.
        // - 정적 객체로 new를 이용하지 않고 사용한다. new Math() (X)
        var num1 = Math.random(); //random()은 0 ~ 1 사이에 실수를 랜덤하게 반환한다.  0.00001~0.9999
        var num2 = Math.pow(3, 2); // 3^2
        var num3 = Math.PI; //원의 원주율 3.141592...
        var num4 = Math.round(5.6); //소수점 반올림

        //1~20까지의 숫자를 랜덤하게 생성
        //var randomNum = Math.floor(Math.random()*20)+1; //Math.floor() 소수점 버림
        var randomNum = ~~ (Math.random()*20)+1; //~~() 소수점 버림
        console.log(randomNum);

        //4. Date객체
        //- 달력: 윤년 고려, 달마다 마지막 날(29, 30, 31일...)
        //- 날짜에 관련된 정보를 제공하는 객체
        var today = new Date(); //default 생성자는 오늘 날짜로 세팅된 객체
        var year = today.getFullYear(); //오늘 날짜에 대한 년도를 구함
        var month = today.getMonth()+1; //0~11월 표현 --> +1을 해줘야 정확한 월을 구함
        var date = today.getDate(); //일
        var day = today.getDay(); //요일:0~6일 표현: 일, 월, 화...
        // var day = ['일', '월', '화', '수', '목', '금', '토'];
        // return  day[date.getDay()] + '요일';
        console.log(year, month, date, day);

        //경과일 이후 날짜 구하기
        //현재 일에서 경과일을 더해서 setDate()메서드로 값을 설정하면 경과일 이후의 날짜를 구할 수 있다.
        var d = 50; //경과일
        today.setDate(today.getDate()+d); //setDate():
        console.log(today.toLocaleString());

        //특정 날짜로 객체 생성
        var tomorrow = new Date("2025-01-07");
        var tomorrow = new Date(2025,1,7);

    </script>
</head>
