<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>계산기.html</title>
<style type="text/css">
	#calculator{
		width:270px;
	}
	#view{
		width:95%;
		height:30px;
	}
	input[type=button]{
		width:50px;
		height:50px;
		margin: 2px;
	}
	input[type=button]:hover{
		background-color:orange;
	}
</style>

</head>
<body>
<h1>계산기 구현하기</h1>
<div id="calculator">
	<fieldset>
		<input id="view" />
	</fieldset>
	<fieldset>
		<div>
			<input type="button" value="C" onclick="calcu(this.value)"/> 
            <!--this.value에서 this는 태그 자기자신 onclick했을 때 input 태그를 의미함
            this는 input이라는 객체의 값을 전달
            -->
			<input type="button" value="←" onclick="calcu(this.value)"/>
			<input type="button" value="=" onclick="calcu(this.value)"/>
			<input type="button" value="/" onclick="calcu(this.value)"/>
		</div>
		<div>
			<input type="button" value="7" onclick="calcu(this.value)"/>
			<input type="button" value="8" onclick="calcu(this.value)"/>
			<input type="button" value="9" onclick="calcu(this.value)"/>
			<input type="button" value="*" onclick="calcu(this.value)"/>
		</div>
		<div>
			<input type="button" value="4" onclick="calcu(this.value)"/>
			<input type="button" value="5" onclick="calcu(this.value)"/>
			<input type="button" value="6" onclick="calcu(this.value)"/>
			<input type="button" value="-" onclick="calcu(this.value)"/>
		</div>
		<div>
			<input type="button" value="1" onclick="calcu(this.value)"/>
			<input type="button" value="2" onclick="calcu(this.value)"/>
			<input type="button" value="3" onclick="calcu(this.value)"/>
			<input type="button" value="+" onclick="calcu(this.value)"/>
		</div>
		<div>
			<input type="button" value="★"/>
			<input type="button" value="0" onclick="calcu(this.value)"/>
			<input type="button" value="★"/>
			<input type="button" value="★"/>
		</div>
	</fieldset>
</div>
<script type="text/javascript">
	//  계산기 기능 구현하기 : 참고 네이버,윈도우 등 계산기 --> 사칙연산, 클리어, 백스페이스(하나씩 지우기)
	//  eval()이라는 함수를 이용하면 보다 쉽게 구현할 수 있음.. 
	//  버튼에 onclick="calcu(this.value)" 이렇게 하면 버튼의 값을 쉽게 함수로 전달할 수 있다.
    var statusWrite="Y";

	function calcu(val){
		console.log(val);
		var view = document.getElementById("view");

		if(val ==="C"){ //전체삭제
			view.value ="";
		}
		else if(val === "←"){ //부분삭제
			view.value = view.value.slice(0, -1);
            //"50+30": 전체 길이에서 -1한 값으로 종료 인덱스를 설정하자
            //"5+10" 총길이값 4 --> substring(0,4-1) --> (0, 3)
            //view.value = view.value.substring(0, view.value.length-1); //"5+10"
			
			//slice() vs substring() 차이점
			//slice()의 인수가 음수인 경우 뒤에서부터 잘라냄
			//substring()의 인수가 0보다 작거나 NaN인 경우 '0'이 되어 모든 문자열 출력
		}
		else if(val === "="){
            try{
                view.value = eval(view.value); //eval() 함수: 문자열을 JS 코드 실행 
                statusWrite="N"
			}
			catch(e){
				view.value = "error";
			}
		}
		else{
			if(statusWrite == "Y"){ //연산 값 입력 중이 경우
                view.value += val; //계산과정 출력기능
            }else if(statusWrite == "N"){ 
                view.value = val; //연산 처음 시작 값 입력
                statusWrite = "Y"; // 새로운 연산이 시작되었다면 Y로 변경
            }

		}
	}
		
</script>

</body>
</html>
