<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var variable=10; //전역변수: 여러 함수나 객체들에서 모두 접근해서 사용

        function test01(){
            variable = variable +5; 
            console.log(variable);
        }
        function test02(){
            variable = variable +10; 
            console.log(variable);
        }
        function test03(){
            var variable2 = 10;
            console.log(variable2); //지역변수: 블럭 내부, 함수 내부에서 사용
        }

        //var 예약어의 문제점
        //1. 호이스팅 현상: js를 실행하기 전에 var로 선언된 변수들을 먼저 맨 위쪽으로 올려버림
        console.log(variable3); 
        var variable3 = 9;

        //2. 재선언 가능
        var variable4 = 20;
        variable4 = 30; //재할당은 당연히 가능함

        var variable4 = 50; //재선언이 됨
        console.log(variable4);
//출력했을 때 왜 variable4만 출력이 되는지,,,?

        /*      기능        선언      할당

        var : 변수 표현,   재선언O,   재할당O
        let : 변수 표현,   재선언X,   재할당O
        const : 상수 표현, 재선언X,   재할당X
        
        */

        //변수의 타입
        let val = 5; //숫자(number) 타입
            val = "문자열"; //문자열(string) 타입
            val = [1, 2, 3, true, "A"]; //배열 타입
            val = true; //boolean 타입
            val = function(){ //JS에서는 function함수 --> 객체로 사용
            }
            //json형식의 객체
            val = {
                "key1":5,
                "key2":10,
                "key3":function(){},
            }
            console.log(typeof val); //typeof 연산자: 변수의 타입을 확인
            //타입에 대한 명확성 부족 --> TypeScript 등장...
        //                              const val:String = "타입";
    </script>
</head>
<body>
    <h1>변수의 선언규칙</h1>
    <p>1. 대소문자구별</p>
    <p>2. 영문자, _, $로 시작할 수 있다.</p>
    <p>3. 영문자, _, $, 숫자를 포함할 수 있다.</p>
    <p>4. 예약어는 사용할 수 없다.</p>

    <h1>변수의 적용범위(Scope)</h1>
    <p>1. 전역변수</p>
    <p>2. 지역변수</p>

    <h1>변수의 선언과 할당</h1>
    <p>1. var 예약어(전통적인 방식)<br/>
        ECMA Script(ES5:var 사용, ES6: let, const 추가)
    </p>
    <p>2. 값 할당할 때 타입: 변수의 타입은 할당하는 값의 타입에 따라 결정된다.</p>

</body>
</html>
