    <script>
     function strTest01(){
        //String을 선언하는 방법 : 리터럴방식
        let string02="string";
        let string03="test";

        // +연산자를 이용하여 문자열을 합친다. 
        let string01="String"+"test";
        let string01_2=string02+string03

        //concat() : 여러 문자열을 합칠때 사용
        var newString="String".concat("test","java","script");
        console.log(newString); 

        // +연산자 : concatenation +연산자에 의해 문자열을 만나면 모두 문자열이 된다.
        // "5"+5 = 10 이 된다고 생각하는데 5가 문자열이기 때문에 55가 되는 상황이 발생 --> 주의해서사용
        let inputObj=document.querySelectorAll("input[name=strTest]");
        console.log(typeof inputObj[0].value);
        console.log(inputObj[0].value+5);
        let strVal=inputObj[0].value;
        let numVal=parseInt(strVal); //정수형의 문자열값을 실제 정수형으로 변환
        console.log(numVal+5); //사칙연산+연산실행

     }

     function strTest02(){
        //동등 연산자 ==(일반적인 비교) , ===(엄격한 비교)
        //패턴으로 비교: 정규화표현식 (match())  [] a-b ^
        let strVal=prompt("당신의 이름은?","");

        //숫자가 포함되었는지 확인
        if(strVal.match(/[0-9]/)){ // "문자열" , [a-z], [0-9]{1}
              alert("숫자가 포함되어 있음... 확인해주세요");
        }else{
            if(strVal=="이한경"){
                console.log("이한경이 맞습니다.");
                document.getElementById("name").innerHTML="<b>이한경</b>"
                //내부 텍스트 요소 가져올때 
                var val=document.getElementById("name").textContent;
            }
        }

        //엄격한 비교 ===
        var strLit="한경"; //리터럴 정의
        var strObj=new String("한경"); // new 생성 방식
        console.log(strLit,strObj);
        alert(strObj);
        if(strLit==strObj){
            console.log("같다.");
        }
        if(strLit===strObj){
            console.log("같다.");
        }else{
            console.log("다르다");
        }
    }

    function strTest03(){
        var strVal="문자열 추출하기. 관련메서드:indexOf()메서드, substring()메서드.";
        var sIdx=strVal.indexOf(":");
        var eIdx=strVal.lastIndexOf("."); //공백도 포포함임~ 거꾸로 찾을때 뒤에서 부터 찾지만 위치는 무조건 앞에서부터 0번째
        var result=strVal.substring(sIdx+1,eIdx); // 결과값은 : "indexOf()메서드, substring()메서드 "
        // :을 포함시키지 않기 때문에 +1 (: 제외하고 가지고오기)
        console.log(result);
        var splitVal=result.split(","); // [indexOf()메서드, substring()메서드]
        var strVal01=splitVal[0].trim();
        var strVal02=splitVal[1].trim(); //앞 뒤 공백제거
        console.log(strVal01,strVal02);
    }
    </script>

    <h2>문자열 추출하기:substring():문자열의 시작index와 종료index로 추출

    <script>
        //문제 : 입력 키워드 최대 6개로 제한
        //입력된 문자열 각각의 키워드를 추출해서 <span>요소에 출력하세요
        //출력하는 형식 : "<br>키워드:수박<br>키워드:바나나<br>키워드:사과" --> span요소에 출력력
        
        // 최대 입력 키워드 수 기본값 설정, 전역변수수
        var maxKeywords = 6; 
        
        function strTest04(){
            var prop=prompt("쉼표로 구분하여 키워드를 입력하세요","예:수박,바나나,사과");

            var keywords = prop.split(",");

            if(keywords.length > maxKeywords){
                alert("입력 키워드 최대" + maxKeywords + "개로 제한");
                keywords = keywords.slice(0,maxKeywords);
            }

            var output = "";
            for(var i = 0; i < keywords.length; i++){
                output += "키워드:"+ keywords[i].trim()+"<br>";
            }
            document.getElementById('key').innerHTML = output;
        }

        // 최대 입력수 설정 함수
        function numCount() {
            // 사용자 입력값 가져오기
            var num = document.getElementById('num').value;

            // 입력값 검증
            if (num && num > 0) {
                maxKeywords = parseInt(num); // 최대 입력 키워드 수 업데이트
                alert("최대 입력수: " + maxKeywords + "개로 설정");
                document.getElementById('setBtn').style.color = "red"; // 버튼 폰트색 빨간색 변경
            } else {
                alert("1 이상의 숫자를 입력하세요!");
            }
        }

    </script>
