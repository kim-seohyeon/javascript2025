<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{border:1px solid red}
    </style>
    <script type="text/javascript">
        function alertTest(){
            alert("메시지만 출력하는 단순 대화창");
        }

        function confirmTest(){
            if(confirm("정말 삭제하시겠습니까?")){
                console.log("삭제를 진행합니다.");
            }else{
                console.log("삭제를 취소합니다.");

            }
        }
        
        function promptTest(){
            //입력하고 확인버튼 클릭하면 텍스트 반환
            //입력을 안 하고 확인버튼 클릭하면 공백 "" 반환
            //취소버튼을 클릭하면면 null 반환
            var txt = prompt("과목을 선택하세요(1:java, 2:DB, 3:JS)", "해당번호를 입력하세요");
            console.log(txt);

            switch(txt){
                case "1":console.log("java를 선택함");
                break;
                case "2":console.log("DB를 선택함");
                break;
                case "3":console.log("JS를 선택함");
                break;
                case null:console.log("취소했습니다.");
                break;                
                default : console.log("다시 입력하세요.");
            }
        }

    </script>
</head>
<body>
    <h1>대화창 함수 사용하기</h1>
    <small>* 종류는 alert() 확인, confirm() 확인/취소, prompt() 입력/확인/취소가 있다.</small> 
    <button onclick="alertTest();">alert 버튼</button>
    <button onclick="confirmTest();">confirm 버튼</button>
    <button onclick="promptTest();">prompt 버튼</button>

</body>
</html>
