<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //객체 생성하기
        //1. Element 객체 생성하기
        //2. Attribute 객체 생성하기
        //3. Text 객체 생성하기

        function eleCreate(){
            // <div style="color:red;">엘리먼트</div>
            var div = document.createElement("div"); //1. <div></div> 생성
            var styleAttr = document.createAttribute("style"); //2. style="" 객체 생성
            var txt = document.createTextNode("엘리먼트"); //3. "엘리먼트" 생성

            //style 객체에 값 넣기
            styleAttr.nodeValue = "color:red;"; //style = "color:red;" 정의 

            //div객체에 style 객체 적용
            div.setAttributeNode(styleAttr); //<div style = "color:red;"></div> 속성 개체를 만들어서 할 떄는 setAttributeNode()
            //div.setAttribute("style", "color:red;") //속성 객체 사용 X 경우, 리터럴?

            //text넣기
            //div.textContent = "엘리먼트"; //리터럴 값 넣을 때
            div.appendChild(txt); //<div style="color:red;">엘리먼트</div>

            //ele.appendChild(node객체): ele 요소 내부에 node객체를 추가하는 기능
            //ele.innerHTML="<b>ss</b>";

            //main 요소에 방금 만든 요소를 추가한다.
            document.getElementById("main").appendChild(div);
        }
        
    </script>
</head>
<body>
    <h1>요소 생성하기</h1>
    <button onclick="eleCreate()">엘리먼트 생성하기</button>
    <div id="main"></div>
</body>
</html>
